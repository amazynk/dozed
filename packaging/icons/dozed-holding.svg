<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- dozed, holding: the same flake, thicker, with a filled hub.
       The difference from the idle icon has to survive being 16 pixels wide on a
       busy panel, so it is weight and a solid centre rather than a change of
       hue: a colour shift at this size is not reliably noticed, and a user who
       cannot tell "holding" from "not holding" at a glance has no reason to look
       at the icon at all. -->
  <g fill="none" stroke="#1a7fc4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <path d="M8 1.6 V14.4"/>
      <path d="M6.1 3.4 L8 5.3 L9.9 3.4"/>
      <path d="M6.1 12.6 L8 10.7 L9.9 12.6"/>
    </g>
    <g transform="rotate(60 8 8)">
      <path d="M8 1.6 V14.4"/>
      <path d="M6.1 3.4 L8 5.3 L9.9 3.4"/>
      <path d="M6.1 12.6 L8 10.7 L9.9 12.6"/>
    </g>
    <g transform="rotate(120 8 8)">
      <path d="M8 1.6 V14.4"/>
      <path d="M6.1 3.4 L8 5.3 L9.9 3.4"/>
      <path d="M6.1 12.6 L8 10.7 L9.9 12.6"/>
    </g>
  </g>
  <circle cx="8" cy="8" r="2.6" fill="#1a7fc4"/>
</svg>
